<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Konsekuensi - XII-9</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>ADMIN XII-9</h1>
    <p>Pencatatan Konsekuensi</p>
</header>

<main>

    <section class="welcome laporan-section">

        <h2>⚠️ Konsekuensi</h2>

        <p class="laporan-description">
            Masukkan data konsekuensi siswa.
        </p>

        <form id="konsekuensiForm">

            <div class="form-group">

                <label for="absen">
                    Absen
                </label>

                <input
                    type="number"
                    id="absen"
                    min="1"
                    max="36"
                    required
                    placeholder="Masukkan nomor absen"
                >

            </div>


            <div class="form-group">

                <label for="kode">
                    Kode
                </label>

                <input
                    type="text"
                    id="kode"
                    required
                    placeholder="Masukkan kode pelanggaran"
                >

            </div>


            <div class="form-group">

                <label for="catatan">
                    Catatan
                </label>

                <textarea
                    id="catatan"
                    rows="5"
                    required
                    placeholder="Masukkan catatan..."
                ></textarea>

            </div>


            <button
                type="submit"
                class="submit-button"
            >
                SIMPAN
            </button>

        </form>

        <p
            id="status"
            class="form-status"
        ></p>

    </section>


    <a
        href="index.html"
        class="back-button"
    >
        ← Kembali
    </a>

</main>

<script src="admin-form.js"></script>

</body>

</html>
