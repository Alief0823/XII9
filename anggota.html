<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Data Anggota - XII-9</title>

    <link rel="stylesheet" href="style.css">

    <style>
        .anggota-section {
            max-width: 1000px;
            margin: auto;
        }

        .search-box {
            width: 100%;
            box-sizing: border-box;
            padding: 13px 15px;
            margin: 15px 0 20px;
            border: 1px solid #ccc;
            border-radius: 10px;
            font-size: 15px;
            font-family: inherit;
        }

        .table-container {
            width: 100%;
            overflow-x: auto;
            border-radius: 12px;
        }

        .anggota-table {
            width: 100%;
            min-width: 700px;
            border-collapse: collapse;
            background: white;
        }

        .anggota-table th,
        .anggota-table td {
            padding: 12px 10px;
            border-bottom: 1px solid #ddd;
            text-align: left;
            white-space: nowrap;
        }

        .anggota-table th {
            font-weight: bold;
        }

        .anggota-table td:nth-child(4),
        .anggota-table td:nth-child(5) {
            text-align: center;
        }

        .kode {
            font-weight: bold;
        }

        .loading {
            text-align: center;
            padding: 25px;
        }

        .error {
            text-align: center;
            padding: 20px;
        }
    </style>
</head>

<body>

<header>
    <h1>DATA ANGGOTA</h1>
    <p>XII-9 System</p>
</header>

<main>

    <section class="welcome anggota-section">

        <h2>👥 Anggota Kelas</h2>

        <input
            type="text"
            id="searchInput"
            class="search-box"
            placeholder="🔎 Cari nama atau nomor absen..."
            autocomplete="off"
        >

        <div class="table-container">

            <table class="anggota-table">

                <thead>
                    <tr>
                        <th>NISN</th>
                        <th>NIS</th>
                        <th>Nama</th>
                        <th>Absen</th>
                        <th>Tahap</th>
                        <th>Kode</th>
                    </tr>
                </thead>

                <tbody id="anggotaBody">

                    <tr>
                        <td colspan="6" class="loading">
                            ⏳ Memuat data anggota...
                        </td>
                    </tr>

                </tbody>

            </table>

        </div>

    </section>

    <a href="index.html" class="back-button">
        ← Kembali
    </a>

</main>


<script>

const CSV_URL =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vRytmifJ1_BZqMG9_Lz482s6kX68e4Dd_9plzh8ykOf6il63D7oG1me2ww8IDrVektTl2okPz_RR0V0/pub?gid=0&single=true&output=csv";


const anggotaBody =
document.getElementById("anggotaBody");

const searchInput =
document.getElementById("searchInput");


let dataAnggota = [];


/* =========================
   PARSE CSV
========================= */

function parseCSV(text) {

    const rows = [];

    let row = [];
    let cell = "";
    let insideQuotes = false;

    for (let i = 0; i < text.length; i++) {

        const char = text[i];
        const next = text[i + 1];

        if (char === '"' && insideQuotes && next === '"') {

            cell += '"';
            i++;

        } else if (char === '"') {

            insideQuotes = !insideQuotes;

        } else if (char === "," && !insideQuotes) {

            row.push(cell);
            cell = "";

        } else if (
            (char === "\n" || char === "\r") &&
            !insideQuotes
        ) {

            if (char === "\r" && next === "\n") {
                i++;
            }

            row.push(cell);
            rows.push(row);

            row = [];
            cell = "";

        } else {

            cell += char;

        }
    }

    if (cell !== "" || row.length > 0) {

        row.push(cell);
        rows.push(row);

    }

    return rows;
}


/* =========================
   LOAD DATA
========================= */

async function loadData() {

    try {

        const response =
            await fetch(CSV_URL);

        if (!response.ok) {
            throw new Error("Gagal mengambil data.");
        }

        const text =
            await response.text();

        const rows =
            parseCSV(text);

        if (rows.length < 2) {
            throw new Error("Data kosong.");
        }


        /*
         * Baris pertama = header
         * Baris berikutnya = data
         */

        dataAnggota =
            rows.slice(1)
                .filter(row => row.length >= 6)
                .map(row => ({

                    nisn: row[0].trim(),
                    nis: row[1].trim(),
                    nama: row[2].trim(),
                    absen: row[3].trim(),
                    tahap: row[4].trim(),
                    kode: row[5].trim()

                }));


        tampilkanData(dataAnggota);

    }

    catch (error) {

        console.error(error);

        anggotaBody.innerHTML = `
            <tr>
                <td colspan="6" class="error">
                    ❌ Data tidak dapat dimuat.
                </td>
            </tr>
        `;

    }

}


/* =========================
   TAMPILKAN DATA
========================= */

function tampilkanData(data) {

    if (data.length === 0) {

        anggotaBody.innerHTML = `
            <tr>
                <td colspan="6" class="error">
                    Data tidak ditemukan.
                </td>
            </tr>
        `;

        return;
    }


    anggotaBody.innerHTML =
        data.map(anggota => `

            <tr>

                <td>${escapeHTML(anggota.nisn)}</td>

                <td>${escapeHTML(anggota.nis)}</td>

                <td>
                    ${escapeHTML(anggota.nama)}
                </td>

                <td>
                    ${escapeHTML(anggota.absen)}
                </td>

                <td>
                    ${escapeHTML(anggota.tahap || "0")}
                </td>

                <td class="kode">
                    ${escapeHTML(anggota.kode || "—")}
                </td>

            </tr>

        `).join("");

}


/* =========================
   PENCARIAN
========================= */

searchInput.addEventListener(
    "input",
    function () {

        const keyword =
            this.value
                .trim()
                .toLowerCase();

        const hasil =
            dataAnggota.filter(anggota =>

                anggota.nama
                    .toLowerCase()
                    .includes(keyword)

                ||

                anggota.absen
                    .toLowerCase()
                    .includes(keyword)

            );

        tampilkanData(hasil);

    }
);


/* =========================
   KEAMANAN HTML
========================= */

function escapeHTML(value) {

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* =========================
   MULAI
========================= */

loadData();

</script>

</body>

</html>
