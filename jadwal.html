<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Jadwal - XII-9</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>JADWAL</h1>
        <p>XII-9 System</p>
    </header>

    <main>

        <section class="welcome">

    <h2>📅 Jadwal Petugas</h2>

    <!-- PIKET HARI INI -->
    <div class="piket-today">
        <h3>📌 Piket Hari Ini</h3>
        <strong id="piket-hari">-</strong>
        <span id="piket-anggota">-</span>
    </div>

    <!-- JADWAL 5K -->
    <h3>📋 Jadwal 5K</h3>

    <div class="schedule">

        <table class="schedule-table">

            <thead>
                <tr>
                    <th>Bidang</th>
                    <th>Senin</th>
                    <th>Selasa</th>
                    <th>Rabu</th>
                    <th>Kamis</th>
                    <th>Jumat</th>
                </tr>
            </thead>

            <tbody>

                <tr>
                    <th>Kebersihan</th>
                    <td id="kebersihan-senin">-</td>
                    <td id="kebersihan-selasa">-</td>
                    <td id="kebersihan-rabu">-</td>
                    <td id="kebersihan-kamis">-</td>
                    <td id="kebersihan-jumat">-</td>
                </tr>

                <tr>
                    <th>Kedisiplinan</th>
                    <td id="kedisiplinan-senin">-</td>
                    <td id="kedisiplinan-selasa">-</td>
                    <td id="kedisiplinan-rabu">-</td>
                    <td id="kedisiplinan-kamis">-</td>
                    <td id="kedisiplinan-jumat">-</td>
                </tr>

                <tr>
                    <th>Keamanan</th>
                    <td id="keamanan-senin">-</td>
                    <td id="keamanan-selasa">-</td>
                    <td id="keamanan-rabu">-</td>
                    <td id="keamanan-kamis">-</td>
                    <td id="keamanan-jumat">-</td>
                </tr>

                <tr>
                    <th>Keindahan</th>
                    <td id="keindahan-senin">-</td>
                    <td id="keindahan-selasa">-</td>
                    <td id="keindahan-rabu">-</td>
                    <td id="keindahan-kamis">-</td>
                    <td id="keindahan-jumat">-</td>
                </tr>

                <tr>
                    <th>Keagamaan</th>
                    <td id="keagamaan-senin">-</td>
                    <td id="keagamaan-selasa">-</td>
                    <td id="keagamaan-rabu">-</td>
                    <td id="keagamaan-kamis">-</td>
                    <td id="keagamaan-jumat">-</td>
                </tr>

            </tbody>

        </table>

    </div>

        </section>

        <a href="index.html" class="back-button">
            ← Kembali
        </a>

    </main>

  <script src="jadwal.js"></script>
  
</body>

</html>
