<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Kritik & Saran - XII-9</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>KRITIK & SARAN</h1>
    <p>XII-9 System</p>
</header>

<main>

    <section class="welcome laporan-section">

        <h2>💬 Kritik, Saran & Pengaduan</h2>

        <p class="laporan-description">
            Sampaikan kritik, saran, atau pengaduan untuk membantu
            meningkatkan sistem kelas.
        </p>

        <form id="saranForm">

            <!-- JENIS -->

            <div class="form-group">

                <label for="jenis">
                    Jenis
                </label>

                <select id="jenis" required>

                    <option value="">
                        Pilih jenis
                    </option>

                    <option value="Kritik">
                        Kritik
                    </option>

                    <option value="Saran">
                        Saran
                    </option>

                    <option value="Pengaduan">
                        Pengaduan
                    </option>

                </select>

            </div>


            <!-- ISI -->

            <div class="form-group">

                <label for="isi">
                    Isi
                </label>

                <textarea
                    id="isi"
                    rows="6"
                    required
                    placeholder="Tuliskan kritik, saran, atau pengaduan..."
                ></textarea>

            </div>


            <!-- ANONIM -->

            <div class="form-group">

                <label for="anonim">
                    Ingin anonim?
                </label>

                <select id="anonim" required>

                    <option value="">
                        Pilih
                    </option>

                    <option value="Ya">
                        Ya
                    </option>

                    <option value="Tidak">
                        Tidak
                    </option>

                </select>

            </div>


            <!-- NAMA -->

            <div
                class="form-group"
                id="namaGroup"
                style="display: none;"
            >

                <label for="nama">
                    Nama
                </label>

                <input
                    type="text"
                    id="nama"
                    placeholder="Masukkan nama"
                >

            </div>


            <button
                type="submit"
                class="submit-button"
            >
                KIRIM
            </button>

        </form>

        <p
            id="status"
            class="form-status"
        ></p>

    </section>


    <a href="index.html" class="back-button">
        ← Kembali
    </a>

</main>

<script src="saran.js"></script>

</body>

</html>
